<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garant:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+SC:wght@300;400&display=swap');

  @page {
    size: A4;
    margin: 0;
    background: #FDFAF5;

    @bottom-left {
      font-family: "Cormorant SC", serif;
      font-size: 8pt;
      color: #B8965A;
      opacity: 0.7;
      content: "{{ pseudonym }}";
      margin-left: 18mm;
      margin-bottom: 12mm;
    }
    @bottom-right {
      font-family: "Cormorant Garant", serif;
      font-weight: 300;
      font-size: 8pt;
      color: #B8965A;
      content: counter(page);
      margin-right: 18mm;
      margin-bottom: 12mm;
    }
  }

  @page :first {
    @bottom-left { content: none; }
    @bottom-right { content: none; }
  }

  @page colophon-page {
    @bottom-left { content: none; }
    @bottom-right { content: none; }
  }

  body {
    background: #FDFAF5;
    color: #2A1F14;
    font-family: "Cormorant Garant", Georgia, serif;
    font-weight: 300;
    font-size: 11.5pt;
    line-height: 1.9;
    margin: 0;
    padding: 0;
    orphans: 3;
    widows: 3;
  }

  /* --- Cover page --- */

  .cover {
    page-break-after: always;
    height: 267mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .cover-compass {
    width: 100mm;
    height: 100mm;
    opacity: 0.10;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .cover-text {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .cover-pseudonym {
    font-family: "Bodoni Moda", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 28pt;
    color: #B8965A;
    margin-bottom: 14pt;
  }

  .cover-rule {
    width: 30mm;
    height: 0;
    border: none;
    border-top: 0.5pt solid #B8965A;
    margin: 0 auto 14pt auto;
  }

  .cover-date {
    font-family: "Cormorant Garant", serif;
    font-weight: 300;
    font-size: 9pt;
    color: #B8965A;
    letter-spacing: 0.18em;
  }

  /* --- Body pages --- */

  .body-content {
    padding: 20mm 18mm;
    border-top: 0.5pt solid #B8965A;
  }

  .body-content .para-wrap {
    break-inside: avoid;
    page-break-inside: avoid;
    margin: 0 0 8pt 0;
  }

  .body-content .para-wrap p {
    margin: 0;
  }

  /* Shadow passage */
  .shadow-passage {
    border-left: 1pt solid #B8965A;
    padding-left: 8mm;
    font-style: italic;
    color: #3A2810;
    break-inside: avoid;
    page-break-inside: avoid;
    margin: 0 0 8pt 0;
  }

  .shadow-passage p {
    margin: 0;
  }

  /* Surprise passage */
  .surprise-passage {
    border-left: 1pt solid #B8965A;
    padding-left: 8mm;
    font-style: italic;
    color: #3A2810;
    break-inside: avoid;
    page-break-inside: avoid;
    margin: 0 0 8pt 0;
  }

  .surprise-passage p {
    margin: 0;
  }

  /* Final line — pseudonym rendered in gold */
  .final-name {
    font-family: "Bodoni Moda", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 13pt;
    color: #B8965A;
  }

  /* --- Colophon --- */

  .colophon-section {
    page: colophon-page;
    page-break-before: always;
    height: 267mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .colophon-rule {
    width: 20mm;
    height: 0;
    border: none;
    border-top: 0.5pt solid #B8965A;
    margin: 0 auto 16pt auto;
    opacity: 0.5;
  }

  .colophon-text {
    font-family: "Cormorant SC", serif;
    font-weight: 300;
    font-size: 8pt;
    color: #8A7A6A;
    line-height: 1.9;
  }
</style>
</head>
<body>

<!-- Cover page -->
<div class="cover">
  <svg class="cover-compass" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <circle cx="120" cy="120" r="110" fill="none" stroke="#B8965A" stroke-width="1"/>
    <circle cx="120" cy="120" r="103" fill="none" stroke="#B8965A" stroke-width="0.4"/>
    <g stroke="#B8965A" stroke-width="0.4">
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(0 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(30 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(60 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(90 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(120 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(150 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(180 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(210 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(240 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(270 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(300 120 120)"/>
      <line x1="120" y1="13" x2="120" y2="23" transform="rotate(330 120 120)"/>
    </g>
    <g stroke="#B8965A" stroke-width="0.3">
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(15 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(45 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(75 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(105 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(135 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(165 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(195 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(225 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(255 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(285 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(315 120 120)"/>
      <line x1="120" y1="15" x2="120" y2="21" transform="rotate(345 120 120)"/>
    </g>
    <g fill="#B8965A" opacity="0.5">
      <polygon points="120,35 114,120 126,120"/>
      <polygon points="120,205 114,120 126,120"/>
      <polygon points="205,120 120,114 120,126"/>
      <polygon points="35,120 120,114 120,126"/>
    </g>
    <g fill="#B8965A" opacity="0.25">
      <polygon points="180,50 118,116 124,122"/>
      <polygon points="180,190 118,124 124,118"/>
      <polygon points="60,190 116,124 122,118"/>
      <polygon points="60,50 116,118 122,124"/>
    </g>
    <g font-family="Cormorant SC, serif" font-size="12" fill="#B8965A" text-anchor="middle" opacity="0.6">
      <text x="120" y="10">N</text>
      <text x="120" y="237">S</text>
      <text x="234" y="124">E</text>
      <text x="6" y="124">W</text>
    </g>
    <circle cx="120" cy="120" r="3" fill="#B8965A" opacity="0.4"/>
  </svg>
  <div class="cover-text">
    <div class="cover-pseudonym">{{ pseudonym }}</div>
    <hr class="cover-rule">
    <div class="cover-date">{{ date }}</div>
  </div>
</div>

<!-- Body pages -->
<div class="body-content">
  {{ portrait_html|safe }}
</div>

<!-- Colophon -->
<div class="colophon-section">
  <hr class="colophon-rule">
  <div class="colophon-text">
    Written for you alone, and for no one else.<br>
    No copy exists anywhere else.<br>
    Scout &middot; {{ date }}
  </div>
</div>

</body>
</html>
