<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 15px;
    line-height: 1.6;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .message {
    max-width: 720px;
    padding: 14px 18px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.scout {
    align-self: flex-start;
    background: #1a1a1a;
    border-left: 3px solid #3a3a3a;
  }

  .message.user {
    align-self: flex-end;
    background: #1a2a1a;
    border-right: 3px solid #2a4a2a;
    text-align: left;
  }

  #input-area {
    border-top: 1px solid #222;
    padding: 16px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    background: #0f0f0f;
  }

  #user-input {
    flex: 1;
    background: #1a1a1a;
    color: #e8e8e8;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    min-height: 48px;
    max-height: 200px;
    outline: none;
  }

  #user-input:focus { border-color: #555; }
  #user-input:disabled { opacity: 0.4; cursor: not-allowed; }

  #send-btn {
    background: #2a2a2a;
    color: #e8e8e8;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  #send-btn:hover { background: #333; }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #conversation::-webkit-scrollbar { width: 6px; }
  #conversation::-webkit-scrollbar-track { background: transparent; }
  #conversation::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  @media (max-width: 600px) {
    .message { max-width: 100%; }
    #input-area { padding: 12px; }
  }
</style>
</head>
<body>

<div id="conversation"></div>

<div id="input-area">
  <textarea id="user-input" rows="1" placeholder="Say something..." disabled></textarea>
  <button id="send-btn" disabled>Send</button>
</div>

<script>
const conversation = document.getElementById("conversation");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");

let locked = true;
let started = false;

// --- Typing delay logic (client-side) ---

const BASE_DELAY = 28;
const JITTER = 8;
const PAUSE_PERIOD = 600;
const PAUSE_COMMA = 250;
const PAUSE_PARAGRAPH = 900;

function charDelay(ch, nextCh) {
  let delay = BASE_DELAY + (Math.random() * JITTER * 2 - JITTER);
  if ((ch === "." || ch === "?" || ch === "!") && nextCh === " ") {
    delay += PAUSE_PERIOD;
  } else if ((ch === "," || ch === "\u2014" || ch === "-") && nextCh === " ") {
    delay += PAUSE_COMMA;
  } else if (ch === "\n" && nextCh === "\n") {
    delay += PAUSE_PARAGRAPH;
  }
  return delay;
}

// Buffer incoming chunks; drain them character-by-character with delays
class TypeWriter {
  constructor(el) {
    this.el = el;
    this.buffer = "";
    this.pos = 0;
    this.done = false;
    this.draining = false;
    this.onFinish = null;
  }

  append(text) {
    this.buffer += text;
    if (!this.draining) this._drain();
  }

  finish() {
    this.done = true;
    if (!this.draining) this._drain();
  }

  async _drain() {
    this.draining = true;
    while (this.pos < this.buffer.length) {
      const ch = this.buffer[this.pos];
      const nextCh = this.buffer[this.pos + 1] || "";
      this.el.textContent += ch;
      this.pos++;
      // Auto-scroll
      conversation.scrollTop = conversation.scrollHeight;
      const delay = charDelay(ch, nextCh);
      await new Promise(r => setTimeout(r, delay));
    }
    this.draining = false;
    if (this.done && this.onFinish) this.onFinish();
  }
}

// --- Messaging ---

function addMessage(role) {
  const div = document.createElement("div");
  div.className = "message " + role;
  conversation.appendChild(div);
  conversation.scrollTop = conversation.scrollHeight;
  return div;
}

function lock() {
  locked = true;
  userInput.disabled = true;
  sendBtn.disabled = true;
}

function unlock() {
  locked = false;
  userInput.disabled = false;
  sendBtn.disabled = false;
  userInput.focus();
}

async function sendMessage(message) {
  lock();
  const scoutEl = addMessage("scout");
  const tw = new TypeWriter(scoutEl);

  tw.onFinish = () => {
    // Detect YAML = interview complete
    const text = scoutEl.textContent;
    if (text.includes("```yaml") && text.includes("spine:")) {
      // Don't unlock — session is done
      userInput.placeholder = "Session complete.";
    } else {
      unlock();
    }
  };

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let partial = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      partial += decoder.decode(value, { stream: true });
      const lines = partial.split("\n");
      partial = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = JSON.parse(line.slice(6));
        if (payload.text) tw.append(payload.text);
        if (payload.done) tw.finish();
      }
    }
  } catch (err) {
    scoutEl.textContent += "\n[Connection error]";
    unlock();
  }
}

// --- Init: request Scout's opening ---

async function init() {
  await sendMessage("__init__");
  started = true;
}

// --- Input handling ---

function handleSend() {
  if (locked) return;
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = "";
  autoResize();
  addMessage("user").textContent = text;
  conversation.scrollTop = conversation.scrollHeight;
  sendMessage(text);
}

sendBtn.addEventListener("click", handleSend);

userInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// Auto-resize textarea
function autoResize() {
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 200) + "px";
}
userInput.addEventListener("input", autoResize);

// Start
init();
</script>
</body>
</html>
